<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    main { max-width: 980px; margin: 20px auto; padding: 0 12px; }
    input, button, select { padding: 8px; margin-right: 8px; margin-top: 6px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    .muted { color: #a8a29e; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    .filterbar { margin: 10px 0; padding: 8px; background: #292524; border-radius: 6px; }
    #historyPanel { margin-top: 16px; padding: 12px; background: #292524; border-radius: 6px; }
    .hrow { padding: 4px 0; border-bottom: 1px dashed #57534e; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>
    <section id="app" hidden>
      <p id="live">等待推送</p>
      <form id="form">
        <input id="site" placeholder="测点" />
        <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
        <input id="wind" placeholder="风速 m/s（必填）" />
        <input id="temp" placeholder="巷温 ℃（必填）" />
        <input id="instrument" placeholder="仪器编号（必填）" />
        <button>上报</button>
      </form>
      <div class="filterbar">
        <input id="frag" placeholder="按仪器编号片段过滤" />
        <button id="filterBtn">过滤</button>
        <button id="clearFilter" class="muted">清除过滤</button>
        <select id="schemes"><option value="">— 命名方案一键套用 —</option></select>
        <span id="schemeEdit">
          <input id="schemeName" placeholder="方案名称" />
          <button id="saveScheme">把当前片段存为方案</button>
        </span>
      </div>
      <table>
        <thead>
          <tr><th>测点</th><th>甲烷 %</th><th>风速</th><th>巷温</th><th>仪器编号</th><th>状态</th><th>说明</th><th>履历</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <section id="historyPanel" hidden>
        <h3>三栏履历 <small id="historyTitle" class="muted"></small></h3>
        <div id="historyRows"></div>
        <form id="correctForm">
          <p class="muted">改正某一栏（只填要改的栏即可，旧履历保留原文）：</p>
          <input id="cWind" placeholder="风速 m/s" />
          <input id="cTemp" placeholder="巷温 ℃" />
          <input id="cInst" placeholder="仪器编号" />
          <button>改正</button>
        </form>
        <button id="closeHistory">关闭履历</button>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
